name: TradingSystem v2

on:
  pull_request:
    branches: [main, rewrite/v2, rewrite/v2-orders, rewrite/v2-recovery, rewrite/v2-lifecycle, rewrite/v2-backtest, rewrite/v2-capital, rewrite/v2-reservations, rewrite/v2-rebalance, rewrite/v2-manual, rewrite/v2-plans, rewrite/v2-deficit, rewrite/v2-protection, rewrite/v2-position-protection, rewrite/v2-quik-contract, rewrite/v2-quik-durability]
    paths:
      - 'src/**'
      - 'tests_v2/**'
      - 'examples/**'
      - 'quik/**'
      - 'pyproject.toml'
      - '.github/workflows/v2.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-core:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - name: Install package and development dependencies
        run: python -m pip install -e ".[dev]"
      - name: Behavioral tests
        run: python -m unittest discover -s tests_v2 -v
      - name: Type checking
        run: python -m mypy
      - name: Offline demonstration
        run: python examples/v2_round_trip.py
      - name: Cancel and replace demonstration
        run: python examples/v2_cancel_replace.py
      - name: Recovery demonstration
        run: python examples/v2_recovery.py
      - name: Strategy optimization demonstration
        run: python examples/v2_optimization.py
      - name: Historical backtest demonstration
        run: python examples/v2_backtest.py
      - name: Capital planning demonstration
        run: python examples/v2_capital.py
      - name: Capital reservation and recovery demonstration
        run: python examples/v2_reservations.py
      - name: Capital source and rebalance demonstration
        run: python examples/v2_rebalance.py
      - name: Manual inventory and transfer demonstration
        run: python examples/v2_manual.py
      - name: Multi-leg plan and failure policy demonstration
        run: python examples/v2_plans.py
      - name: Account deficit reduction and recovery demonstration
        run: python examples/v2_deficit.py
      - name: Take profit and trailing protection demonstration
        run: python examples/v2_protection.py
      - name: Existing position protection and ownership demonstration
        run: python examples/v2_position_protection.py
      - name: QUIK callback contract replay demonstration
        run: python examples/v2_quik_contract.py
      - name: Durable QUIK callback recovery demonstration
        run: python examples/v2_quik_recovery.py
      - name: Read-only QUIK loopback demonstration
        run: python examples/v2_quik_readonly.py
