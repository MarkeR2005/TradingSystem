name: TradingSystem v2

on:
  pull_request:
    branches: [main, rewrite/v2, rewrite/v2-orders, rewrite/v2-recovery]
    paths:
      - 'src/**'
      - 'tests_v2/**'
      - 'examples/**'
      - 'pyproject.toml'
      - '.github/workflows/v2.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-core:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - name: Install package and development dependencies
        run: python -m pip install -e ".[dev]"
      - name: Behavioral tests
        run: python -m unittest discover -s tests_v2 -v
      - name: Type checking
        run: python -m mypy
      - name: Offline demonstration
        run: python examples/v2_round_trip.py
      - name: Cancel and replace demonstration
        run: python examples/v2_cancel_replace.py
      - name: Recovery demonstration
        run: python examples/v2_recovery.py
      - name: Strategy optimization demonstration
        run: python examples/v2_optimization.py
