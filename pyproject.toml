[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "trading-system-v2"
version = "0.1.0"
description = "Offline trading core developed through XP and TDD"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
dev = ["mypy==1.18.2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.mypy]
python_version = "3.12"
strict = true
explicit_package_bases = true
mypy_path = "src"
files = ["src/trading_system", "examples/v2_round_trip.py", "examples/v2_cancel_replace.py", "examples/v2_recovery.py", "examples/v2_optimization.py", "examples/v2_backtest.py"]
